<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万代自習室</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
  <div class="header-inner">
    <div class="logo">万代自習室</div>
  </div>
</header>
<section class="hero">
  <div class="slider">
    <div class="slider-track">
      <img src="images/Slide1.png" alt="万代自習室">
      <img src="images/Slide2.png" alt="一般料金">
      <img src="images/Slide3.png" alt="学生料金">
      <img src="images/Slide4.png" alt="アクセス">
      <img src="images/Slide5.png" alt="設備">
      <img src="images/Slide6.png" alt="店舗入口">
      <img src="images/Slide1.png" alt="万代自習室">
    </div>
  </div>
</section>  
<script>
const track = document.querySelector('.slider-track');
const totalSlides = 6;
let current = 0;

setInterval(() => {
  current++;

  track.style.transform = `translateX(-${current * 100}%)`;

  if (current === totalSlides) {
    setTimeout(() => {
      track.style.transition = 'none';
      current = 0;
      track.style.transform = 'translateX(0)';

      void track.offsetWidth;

      track.style.transition = 'transform 0.6s ease-in-out';
    }, 600);
  }
}, 3000);
</script>
