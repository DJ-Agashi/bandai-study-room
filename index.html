<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万代自習室</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
  <div class="header-inner">
    <div class="logo">万代自習室</div>
  </div>
</header>
<section class="hero">
  <div class="slider">
    <img src="images/Slide1.png" alt="万代自習室">
    <img src="images/Slide2.png" alt="一般料金">
    <img src="images/Slide3.png" alt="学生料金">
    <img src="images/Slide4.png" alt="アクセス">
    <img src="images/Slide5.png" alt="設備">
    <img src="images/Slide6.png" alt="店舗入口">
  </div>
</section>
  
<script>
const slides = document.querySelectorAll('.slider img');
let current = 0;

setInterval(() => {
  slides[current].style.left = '-100%';

  current = (current + 1) % slides.length;

  slides[current].style.left = '100%';

  setTimeout(() => {
    slides[current].style.left = '0';
  }, 50);

}, 3000);
</script>
  
</body>
</html>
